# ==========================================================
#  Netlify konfiguráció — zsedelydavid.hu
#  Nincs build lépés: statikus oldal, a gyökér a publish mappa.
# ==========================================================

[build]
  publish = "."
  command = ""

# ---------- Biztonsági és teljesítmény fejlécek ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Képek, betűk, CSS/JS: hosszú cache (a fájlnév változtatásával frissül)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# HTML: mindig friss
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- Átirányítások ----------
# www → csupasz domain (301)
[[redirects]]
  from = "https://www.zsedelydavid.hu/*"
  to = "https://zsedelydavid.hu/:splat"
  status = 301
  force = true
