<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Zsédely Dávid</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/style.css?v=4">
<link rel="stylesheet" href="/admin/admin.css?v=3">
</head>
<body class="adm">

<!-- ---------- Belépés ---------- -->
<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <span class="mark" aria-hidden="true">ZD</span>
    <h1>Admin belépés</h1>
    <p>Add meg a jelszót a tartalom szerkesztéséhez.</p>
    <label for="pw">Jelszó</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Belépés</button>
    <p class="err" id="gateErr" hidden></p>
    <a class="back" href="/">← Vissza a weboldalra</a>
  </form>
</div>

<!-- ---------- Szerkesztő ---------- -->
<div class="app" id="app" hidden>
  <header class="abar">
    <div class="abar-l">
      <span class="mark" aria-hidden="true">ZD</span>
      <div>
        <strong>Tartalom szerkesztő</strong>
        <span id="status">Betöltés…</span>
      </div>
    </div>
    <div class="abar-r">
      <select id="page" class="pagesel" aria-label="Szerkesztett oldal">
        <option value="index.html">Főoldal</option>
        <option value="szemelyi-edzes-gymtronic-gyor.html">Személyi edzés – Gymtronic</option>
        <option value="kulteri-szemelyi-edzes-gyor.html">Kültéri edzés</option>
        <option value="paros-edzes-gyor.html">Páros edzés</option>
        <option value="elso-alkalom.html">Első alkalom</option>
        <option value="szemelyi-edzes-arak-gyor.html">Árak</option>
        <option value="aszf.html">ÁSZF</option>
        <option value="adatkezeles.html">Adatkezelési tájékoztató</option>
        <option value="impresszum.html">Impresszum</option>
      </select>
      <a class="btn btn-ghost btn-sm" id="openPage" href="/" target="_blank" rel="noopener">Oldal megnyitása ↗</a>
      <button class="btn btn-ghost btn-sm" id="reload" type="button">Elvetés</button>
      <button class="btn btn-primary btn-sm" id="save" type="button" disabled>Mentés és közzététel</button>
    </div>
  </header>

  <div class="alayout">
    <aside class="aside" id="aside"></aside>
    <main class="amain">
      <div class="notice" id="notice" hidden></div>
      <div id="editor"></div>
    </main>
  </div>
</div>

<script src="/admin/admin.js?v=3"></script>
</body>
</html>
