# ==========================================================
#  Netlify konfiguráció — zsedelydavid.hu
#  Nincs build lépés: statikus oldal, a gyökér a publish mappa.
# ==========================================================

[build]
  publish = "."
  command = ""

# ---------- Biztonsági és teljesítmény fejlécek ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Képek, betűk, CSS/JS: hosszú cache (a fájlnév változtatásával frissül)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A CSS/JS a HTML-lel együtt változik, ezért mindig ellenőrizni kell.
# Az ETag miatt ez nem jelent újraletöltést, ha nem változott (304).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML: mindig friss
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- Átirányítások ----------
# Cél: minden tartalom PONTOSAN EGY URL-en legyen elérhető.
# Sorrend számít: a Netlify felülről lefelé értékel, az első találat nyer.

# 1. www → csupasz domain
[[redirects]]
  from = "https://www.zsedelydavid.hu/*"
  to = "https://zsedelydavid.hu/:splat"
  status = 301
  force = true

# 2. Netlify aldomain → saját domain (különben duplikált tartalom indexelődik)
[[redirects]]
  from = "https://zsedelydavid.netlify.app/*"
  to = "https://zsedelydavid.hu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://zsedelydavid.netlify.app/*"
  to = "https://zsedelydavid.hu/:splat"
  status = 301
  force = true

# 3. .html végű URL-ek → tiszta URL (a Netlify mindkettőt kiszolgálná)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/adatkezeles.html"
  to = "/adatkezeles"
  status = 301
  force = true

[[redirects]]
  from = "/aszf.html"
  to = "/aszf"
  status = 301
  force = true

[[redirects]]
  from = "/koszonjuk.html"
  to = "/koszonjuk"
  status = 301
  force = true

# ---------- Nem-produkciós környezetek kizárása a keresőkből ----------
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"
